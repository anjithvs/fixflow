   spring:
     application:
       name: backend
     datasource:
       url: jdbc:postgresql://localhost:5432/fixflow
       username: fixflow
       password: fixflow_dev
     jpa:
       hibernate:
         ddl-auto: validate

   management:
     endpoints:
       web:
         exposure:
           include: health

   server:
     error:
       include-message: always

   app:
     jwt:
       # Development-only secret. We'll move it to a safe place before deploying.
       secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789}
       expiration-minutes: 60